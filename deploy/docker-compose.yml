version: "3.8"

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: quant-gateway
    ports:
      - "8321:8321"
    restart: unless-stopped
    volumes:
      - ../config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8321/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: quant-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/quant-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: quant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: quant-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped